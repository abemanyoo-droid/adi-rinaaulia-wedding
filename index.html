<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Pernikahan</title>
<meta name="theme-color" content="#2f4a3c">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--surface:#fff;--ink:#3b3a33;--muted:#7a776b;--accent:#a8854a;--soft:#e9e0cf;--hero:#2f4a3c;--hero-ink:#faf6ef;--bar:rgba(250,246,239,.85);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c18;--surface:#1f2822;--ink:#ece6d8;--muted:#a29d8d;--accent:#cfaa68;--soft:#34403a;--hero:#0f1612;--hero-ink:#ece6d8;--bar:rgba(22,28,24,.85);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161c18;--surface:#1f2822;--ink:#ece6d8;--muted:#a29d8d;--accent:#cfaa68;--soft:#34403a;--hero:#0f1612;--hero-ink:#ece6d8;--bar:rgba(22,28,24,.85);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.7 Montserrat,system-ui,sans-serif;text-align:center;transition:background .4s,color .4s}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:41}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;margin:0}
section{padding:72px 24px;max-width:560px;margin:0 auto}
.eyebrow{letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:var(--accent);margin-bottom:12px}
h2{font-size:38px;margin-bottom:20px}
.orn{width:60px;height:1px;background:var(--accent);margin:20px auto}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s}
.reveal.in{opacity:1;transform:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--soft)}
header .logo{font:italic 22px "Cormorant Garamond",serif;color:var(--accent)}
.tools{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--soft);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;position:relative;transition:.25s}
.ib:hover,.ib.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ib.hidden{display:none}
.ib.playing svg{animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
/* cover */
#cover{position:fixed;inset:0;z-index:60;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:transform 1s,opacity 1s;background-size:cover;background-position:center}
#cover.open{transform:translateY(-100%);opacity:0;pointer-events:none}
#cover h1{font-size:56px;margin:10px 0;font-style:italic}
.guest{border:1px solid var(--accent);padding:12px 28px;margin:24px 0;border-radius:2px;background:rgba(0,0,0,.25)}
.guest b{display:block;font-weight:500;font-size:17px}
button.btn,.btn{font:500 12px Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase;background:var(--accent);color:#fff;border:1px solid var(--accent);padding:13px 24px;border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}
.btn.ghost{background:transparent;color:var(--accent)}
/* hero */
.hero{min-height:100vh;max-width:none;color:#faf6ef;display:flex;flex-direction:column;justify-content:center;align-items:center;background-size:cover;background-position:center}
.hero h1{font-size:64px;font-style:italic;line-height:1.1}
.hero .amp{font-size:36px;color:#d9b97a}
.cd{display:flex;gap:10px;justify-content:center;margin-top:28px}
.cd div{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);min-width:68px;padding:12px 6px;border-radius:4px}
.cd b{display:block;font:600 26px "Cormorant Garamond",serif}
.cd span{font-size:10px;letter-spacing:.15em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--soft);border-radius:6px;padding:28px 22px;margin:16px 0}
.avatar{width:130px;height:130px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--soft),var(--accent)) center/cover;display:grid;place-items:center;font:italic 44px "Cormorant Garamond",serif;color:#fff}
.couple{display:grid;gap:28px}
.timeline{text-align:left;border-left:1px solid var(--accent);margin:24px 0 0 10px;padding-left:22px}
.timeline div{margin-bottom:24px;position:relative}
.timeline div:before{content:"";position:absolute;left:-28px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.timeline b{font:600 20px "Cormorant Garamond",serif;color:var(--accent);display:block}
.event h3{font-size:30px;color:var(--accent)}
.event p{margin:4px 0}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.tabs button{font:400 12px Montserrat;letter-spacing:.15em;text-transform:uppercase;padding:9px 18px;border-radius:30px;border:1px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapbox{height:280px;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 14px,var(--surface) 14px,var(--surface) 28px);border:1px solid var(--soft)}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery i{aspect-ratio:1;border-radius:4px;display:block;background-size:cover;background-position:center}
.acc{font:600 24px "Cormorant Garamond",serif;letter-spacing:.05em;margin:6px 0}
.ok{color:var(--accent);min-height:22px;margin-top:8px;font-size:13px}
form{display:grid;gap:12px;text-align:left}
label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:300 15px Montserrat,sans-serif;padding:11px;background:var(--bg);color:var(--ink);border:1px solid var(--soft);border-radius:3px}
.wishes{text-align:left;max-height:340px;overflow-y:auto;margin-top:18px}
.wish{padding:12px 0;border-bottom:1px solid var(--soft)}
.wish small{color:var(--muted);display:block}
footer{background:var(--hero);color:var(--hero-ink);padding:0 0 110px}
footer h2{font-style:italic}
/* bottom nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:2px;background:var(--bar);backdrop-filter:blur(10px);border:1px solid var(--soft);border-radius:40px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
nav a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative;transition:.25s}
nav a.on{background:var(--accent);color:#fff}
nav a::after{content:attr(data-l);position:absolute;bottom:50px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:10px;letter-spacing:.1em;padding:3px 9px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
nav a:hover::after{opacity:1}
.hidden{display:none!important}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.modal .card{width:min(360px,100%);margin:0;text-align:left}
.modal h3{font-size:28px;color:var(--accent);margin-bottom:6px}
.modal form{margin-top:12px}
/* panels */
.pop{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:12px;z-index:45;width:min(300px,92vw);background:var(--surface);border:1px solid var(--soft);border-radius:10px;padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.25);text-align:left}
.pop h4{margin:0 0 10px;font:600 20px "Cormorant Garamond",serif;color:var(--accent)}
.pop .row{display:flex;gap:10px;align-items:center;margin-top:12px}
.trk{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop{max-height:calc(100vh - 80px - env(safe-area-inset-top,0px));overflow-y:auto}
.pop .hint{display:block;margin-top:8px;color:var(--muted);font-size:11px;line-height:1.5}
.pl{margin-top:12px;max-height:200px;overflow-y:auto;border-top:1px solid var(--soft)}
.pl .it{display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:1px solid var(--soft);font-size:13px}
.pl .it.on{color:var(--accent);font-weight:500}
.pl .t{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;color:inherit;font:inherit;padding:6px 0;cursor:pointer}
.pl span.t{cursor:default}
.pl .tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:1px 7px;flex:none}
.pl .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:4px 6px;flex:none}
.pl small{display:block;padding:10px 0;color:var(--muted)}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=file]{display:none}
#cms{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:70;background:var(--surface);border-left:1px solid var(--soft);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(90px + env(safe-area-inset-bottom,0px));text-align:left;transform:translateX(100%);transition:transform .35s;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
#cms.open{transform:none}
#cms h3{font-size:26px;color:var(--accent)}
#cms details{border:1px solid var(--soft);border-radius:6px;margin:10px 0;padding:10px 12px}
#cms summary{cursor:pointer;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#cms .f{margin-top:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs span{width:64px;height:64px;border-radius:4px;background-size:cover;background-position:center;position:relative;border:1px solid var(--soft)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;font-size:12px;line-height:1;padding:0}
.cmsbar{position:sticky;bottom:calc(-90px - env(safe-area-inset-bottom,0px));margin:16px -18px 0;padding:12px 18px;background:var(--surface);border-top:1px solid var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,label{touch-action:manipulation}
input,select,textarea{font-size:16px}
section{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
header{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#cover{justify-content:flex-start;overflow-y:auto;height:100vh;height:100svh}
#cover::before,#cover::after{content:"";margin:auto}
.hero{min-height:100vh;min-height:100svh}
.hero h1{font-size:clamp(44px,13vw,84px)}
#cover h1{font-size:clamp(40px,12vw,72px)}
h2{font-size:clamp(32px,8vw,46px)}
.cd{flex-wrap:wrap}.cd div{min-width:clamp(56px,16vw,76px)}
.card h3{overflow-wrap:anywhere}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block;background:var(--soft)}
.mapbox{height:clamp(240px,60vw,400px)}
nav{max-width:calc(100vw - 16px)}
nav a{width:clamp(32px,9.6vw,40px);height:clamp(32px,9.6vw,40px)}
.pop{max-width:calc(100vw - 24px)}
@media (hover:none){nav a::after{display:none}}
#cms{visibility:hidden;box-shadow:none;transition:transform .35s,visibility 0s .35s}
#cms.open{visibility:visible;box-shadow:-10px 0 30px rgba(0,0,0,.2);transition:transform .35s}
@media (min-width:768px){
body{font-size:16px}
section{max-width:760px;padding-top:96px;padding-bottom:96px}
.couple{grid-template-columns:1fr 1fr}
.evgrid,.gfgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.evgrid .card,.gfgrid .card{margin:0}
.gallery{grid-template-columns:repeat(4,1fr);gap:12px}
nav a{width:44px;height:44px}
header{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px}
}
@media (min-width:1100px){section{max-width:980px}.mapbox{height:420px}}
@media (max-height:480px) and (orientation:landscape){.hero{min-height:auto;padding-top:90px;padding-bottom:90px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}*{animation:none!important}}

.spd{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:39;font:500 11px Montserrat,sans-serif;letter-spacing:.06em;background:var(--accent);color:#fff;border:0;border-radius:20px;padding:6px 12px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
@media (min-width:768px){.spd{top:calc(68px + env(safe-area-inset-top,0px))}}
/* menu musik sebagai panel di sisi kanan */
#musicPop{top:calc(58px + env(safe-area-inset-top,0px));right:0;bottom:0;max-height:none;width:min(360px,100vw);max-width:100vw;border-radius:0;border-width:0 0 0 1px;box-shadow:-10px 0 30px rgba(0,0,0,.2);padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){#musicPop{top:calc(68px + env(safe-area-inset-top,0px))}}
#musicPop .pl{max-height:calc(100vh - 400px);min-height:120px}
</style>
</head>

    g[1].forEach(function(f){var t=f[2]||'text';h+='<div class="f"><label>'+f[1]+'</label>'+(t==='area'?'<textarea rows="3" data-k="'+f[0]+'"></textarea>':'<input type="'+t+'" data-k="'+f[0]+'">')+'</div>'});
    (g[2]||[]).forEach(function(f){h+='<div class="f"><label>'+f[1]+'</label><div class="thumbs" id="th-'+f[0]+'"></div><label class="btn ghost" style="margin:8px 0 0;cursor:pointer">Unggah gambar<input type="file" accept="image/*" data-img="'+f[0]+'"></label></div>'});
    if(gi===2){}h+='</details>'});
  h+='<details><summary>Galeri</summary><div class="f"><div class="thumbs" id="th-gallery"></div><label class="btn ghost" style="margin:8px 0 0;cursor:pointer">Tambah foto<input type="file" accept="image/*" multiple data-img="gallery"></label></div></details>';
  h+='<details><summary>Musik Wajib</summary><div class="f"><p style="color:var(--muted);font-size:13px;margin:0 0 8px">Lagu di daftar ini tampil untuk semua tamu dan tidak bisa dihapus tamu. Tamu tetap bisa menambah lagu sendiri (hanya di perangkat mereka).</p><div class="pl" id="plAdm"></div><label style="margin-top:10px">Judul lagu</label><input type="text" id="plT"><label style="margin-top:8px">Tautan atau jalur file</label><input type="text" id="plU" placeholder="musik/lagu-1.mp3"><div style="margin-top:8px"><label class="btn ghost" style="margin:4px 4px 0 0;cursor:pointer">'+(db?'Unggah MP3':'Pilih MP3')+'<input type="file" id="plF" accept="audio/*,.mp3"></label><button class="btn" id="plAdd" style="margin:4px 0 0">Tambah</button></div><div class="ok" id="plMsg"></div></div></details>';
  if(!db)h+='<details><summary>Keamanan</summary><div class="f"><label>Password admin baru (min. 8 karakter)</label><input type="password" id="newPw" autocomplete="new-password"><button class="btn ghost" id="chPw" style="margin:8px 0 0">Ubah Password</button></div></details>';
  h+='<div class="cmsbar"><button class="btn" id="cmsSave">Simpan</button><button class="btn ghost" id="cmsReset">Reset</button>'+(!db?'<button class="btn ghost" id="cmsExp">Unduh content.json</button>':'')+'<button class="btn ghost" id="cmsClose">Tutup</button><div class="ok" id="cmsMsg" style="width:100%"></div></div>';
  var el=$('#cms');el.innerHTML=h;
  $$('[data-k]',el).forEach(function(i){i.value=C[i.dataset.k]||'';i.oninput=function(){C[i.dataset.k]=i.value;later()}});
  thumbs();plAdm();
  $('#plF').onchange=async function(){var f=this.files[0];this.value='';if(!f)return;
    if(!(/^audio\//.test(f.type)||AEXT.test(f.name))){pm('File harus berupa audio (mp3, m4a, wav, ogg).');return}
    if(!$('#plT').value)$('#plT').value=f.name.replace(/\.[^.]+$/,'');
    if(db&&assets){pm('Mengunggah…');try{var r=await assets.upload(f);$('#plU').value=r.url;pm('Terunggah. Klik Tambah.')}catch(e){pm('Gagal mengunggah: '+(e.message||e.code||''))}}
    else{$('#plU').value='musik/'+f.name;pm('Salin file ini ke folder "musik" (di samping index.html) dengan nama yang sama, lalu klik Tambah.')}};
  $('#plAdd').onclick=function(){var u=$('#plU').value.trim(),n=$('#plT').value.trim();
    if(!u){pm('Isi tautan atau jalur file.');return}if(/^javascript:/i.test(u)){pm('Tautan tidak valid.');return}
    (C.playlist=C.playlist||[]).push({n:n||fname(u),u:u});$('#plT').value=$('#plU').value='';plAdm();refreshMusic();pm('Ditambahkan. Klik Simpan agar tampil untuk semua tamu.')};
  $$('[data-img]',el).forEach(function(i){i.onchange=async function(){
    if(!assets){msg('Unggah gambar hanya tersedia untuk editor.');return}
    var k=i.dataset.img;msg('Mengunggah…');
    try{for(var n=0;n<i.files.length;n++){var r=await assets.upload(await shrink(i.files[n],k==='heroImg'?1920:k==='gallery'?1200:800));if(k==='gallery')C.gallery=(C.gallery||[]).concat(r.url);else C[k]=r.url}
      msg('Gambar terunggah. Klik Simpan.');thumbs();render()}catch(e){msg('Gagal mengunggah: '+(e.message||e.code||''))}i.value=''}});
  if($('#chPw'))$('#chPw').onclick=async function(){var p=$('#newPw').value;if(p.length<8){msg('Minimal 8 karakter.');return}var sl=newSalt();C.adm={s:sl,h:await hashPw(p,sl)};saveLocal();$('#newPw').value='';msg('Password diubah. Unduh content.json agar berlaku di hosting.')};
  $('#cmsSave').onclick=async function(){if(!db){try{localStorage.setItem(KC,JSON.stringify(C));msg('Tersimpan di browser ini. Klik Unduh content.json untuk dipasang di hosting.')}catch(e){msg('Penyimpanan penuh: kurangi jumlah/ukuran foto.')}return}
    msg('Menyimpan…');try{await db.doc('site/content').set(C);msg('Tersimpan. Perubahan tampil untuk semua pengunjung.')}catch(e){msg('Gagal menyimpan: '+(e.message||e.code||''))}};
  if($('#cmsExp'))$('#cmsExp').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,1)],{type:'application/json'}));a.download='content.json';a.click()};
  $('#cmsReset').onclick=function(){if(confirm('Kembalikan semua konten ke bawaan? (Belum tersimpan sebelum klik Simpan)')){var ad=C.adm;C=JSON.parse(JSON.stringify(DEF));if(ad)C.adm=ad;buildCms();render();refreshMusic()}};
  $('#cmsClose').onclick=function(){el.classList.remove('open');$('#bEdit').classList.remove('on')};
}
function shrink(f,max){return new Promise(function(res){if(!/^image\/(jpeg|png|webp)$/.test(f.type)){res(f);return}var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b||f)},'image/jpeg',.82)};
  im.onerror=function(){URL.revokeObjectURL(u);res(f)};im.src=u})}
function thumbs(){['heroImg','brideImg','groomImg'].forEach(function(k){var t=$('#th-'+k);if(t)t.innerHTML=C[k]?'<span style="'+bg(C[k])+'"><button data-x="'+k+'" aria-label="Hapus">×</button></span>':'<small style="color:var(--muted)">Belum ada gambar</small>'});
  var g=$('#th-gallery');if(g)g.innerHTML=(C.gallery||[]).map(function(u,i){return '<span style="'+bg(u)+'"><button data-gx="'+i+'" aria-label="Hapus">×</button></span>'}).join('')||'<small style="color:var(--muted)">Belum ada foto</small>';
  $$('[data-x]').forEach(function(b){b.onclick=function(){C[b.dataset.x]='';thumbs();render()}});
  $$('[data-gx]').forEach(function(b){b.onclick=function(){C.gallery.splice(+b.dataset.gx,1);thumbs();render()}})}
setIc($('#bEdit'),'edit');
$('#bEdit').onclick=function(){buildCms();var el=$('#cms');el.classList.toggle('open');$('#bEdit').classList.toggle('on',el.classList.contains('open'))};

/* ---------- login admin (mode mandiri) ---------- */
var authed=false;try{authed=sessionStorage.getItem(KS)==='1'}catch(e){}
setIc($('#bLock'),'lock');
function b64(u){return btoa(String.fromCharCode.apply(null,new Uint8Array(u)))}
async function hashPw(pw,salt){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),function(c){return c.charCodeAt(0)}),iterations:150000,hash:'SHA-256'},k,256))}
function newSalt(){return b64(crypto.getRandomValues(new Uint8Array(16)))}
function saveLocal(){try{localStorage.setItem(KC,JSON.stringify(C))}catch(e){}}
function lockUi(){setIc($('#bLock'),authed?'unlock':'lock');$('#bLock').title=authed?'Keluar admin':'Login admin';$('#bLock').setAttribute('aria-label',$('#bLock').title);
  $('#bEdit').classList.toggle('hidden',!authed);if(!authed){$('#cms').classList.remove('open');$('#bEdit').classList.remove('on')}}
var fails=0,lockUntil=0;
function openLogin(){var setup=!(C.adm&&C.adm.h);$('#lgTitle').textContent=setup?'Buat Password Admin':'Login Admin';$('#lgPw2w').classList.toggle('hidden',!setup);
  $('#lgMsg').textContent=setup?'Belum ada password. Buat password (min. 8 karakter).':'';$('#lgReset').classList.toggle('hidden',setup);$('#lgPw').value=$('#lgPw2').value='';$('#login').classList.remove('hidden');$('#lgPw').focus()}
$('#lgReset').onclick=function(e){e.preventDefault();if(!confirm('Hapus password & editan yang tersimpan di browser ini untuk situs ini?\n\nJika content.json di hosting sudah berisi password, password itu tetap berlaku sampai bagian "adm" dihapus dari file tersebut.'))return;try{localStorage.removeItem(KC);sessionStorage.removeItem(KS)}catch(x){}location.reload()};
$('#lgCancel').onclick=function(){$('#login').classList.add('hidden')};
$('#lgForm').onsubmit=async function(e){e.preventDefault();var m=$('#lgMsg');
  if(!(window.crypto&&crypto.subtle)){m.textContent='Browser ini tidak mendukung enkripsi. Buka lewat https atau localhost.';return}
  var pw=$('#lgPw').value,setup=!(C.adm&&C.adm.h);
  if(setup){if(pw.length<8){m.textContent='Minimal 8 karakter.';return}if(pw!==$('#lgPw2').value){m.textContent='Konfirmasi password tidak sama.';return}
    var sl=newSalt();C.adm={s:sl,h:await hashPw(pw,sl)};saveLocal();authed=true}
  else{if(Date.now()<lockUntil){m.textContent='Terlalu banyak percobaan. Tunggu 30 detik.';return}
    if(await hashPw(pw,C.adm.s)!==C.adm.h){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}m.textContent='Password salah.';return}
    authed=true;fails=0}
  try{sessionStorage.setItem(KS,'1')}catch(x){}
  $('#login').classList.add('hidden');lockUi()};
$('#bLock').onclick=function(){if(authed){authed=false;try{sessionStorage.removeItem(KS)}catch(e){}lockUi()}else openLogin()};
P.prev='<path d="M19 20L9 12l10-8z"/><path d="M5 19V5"/>';
P.next='<path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/>';
P.lock='<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>';
P.unlock='<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.500-2"/>';
setIc($('#bLock'),'lock');

/* ---------- gulir otomatis ---------- */
P.scroll='<path d="M12 4v12"/><path d="M6 11l6 6 6-6"/><path d="M6 21h12"/>';
var auto=false,raf=0,last=0,acc=0,SP=[1,2,3],si=0,bScroll=$('#bScroll'),chip=$('#spdChip');
function autoUi(){setIc(bScroll,auto?'pause':'scroll');bScroll.classList.toggle('on',auto);bScroll.classList.toggle('playing',auto);bScroll.setAttribute('aria-pressed',auto);
  var t=auto?'Hentikan gulir otomatis':'Gulir otomatis';bScroll.title=t;bScroll.setAttribute('aria-label',t);chip.classList.toggle('hidden',!auto);chip.textContent='Kecepatan '+SP[si]+'x'}
function stepAuto(t){if(!auto)return;var dt=Math.min(64,t-last);last=t;acc+=35*SP[si]*dt/1000;var px=Math.floor(acc);
  if(px>=1){acc-=px;window.scrollBy(0,px)}
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2){stopAuto();return}
  raf=requestAnimationFrame(stepAuto)}
function startAuto(){if(document.body.classList.contains('locked'))return;auto=true;acc=0;last=performance.now();root.style.scrollBehavior='auto';autoUi();raf=requestAnimationFrame(stepAuto)}
function stopAuto(){if(!auto)return;auto=false;cancelAnimationFrame(raf);root.style.scrollBehavior='';autoUi()}
bScroll.onclick=function(){auto?stopAuto():startAuto()};
chip.onclick=function(){si=(si+1)%SP.length;autoUi()};
['wheel','touchstart','mousedown','keydown'].forEach(function(ev){window.addEventListener(ev,function(e){if(!auto)return;var t=e.target;if(t&&t.closest&&t.closest('#bScroll,#spdChip'))return;stopAuto()},{passive:true})});
document.addEventListener('visibilitychange',function(){if(document.hidden)stopAuto()});
autoUi();

render();

/* ---------- sambungkan CMS (db, assets, user) ---------- */
(async function(){
  try{if(window.claude&&claude.use){user=await claude.use('user');db=await claude.use('db');assets=await claude.use('assets')}}catch(e){}
  if(db){try{var s=await db.doc('site/content').get();if(s.exists){C=Object.assign({},DEF,s.data());render()}}catch(e){}}
  try{if(user&&user.canEdit&&user.canEdit())$('#bEdit').classList.remove('hidden')}catch(e){}
  if(!db){ /* mode mandiri (hosting sendiri): content.json + localStorage */
    try{var r=await fetch('content.json',{cache:'no-store'});if(r.ok){C=Object.assign({},DEF,await r.json())}}catch(e){}
    try{var l=localStorage.getItem(KC);if(l)C=Object.assign({},C,JSON.parse(l))}catch(e){}
    render();
    assets={upload:function(f){return new Promise(function(res,rej){var rd=new FileReader();rd.onload=function(){res({url:rd.result})};rd.onerror=rej;rd.readAsDataURL(f)})}};
    var showLock=location.search.indexOf('admin')>-1||/localhost|127\.0\.0\.1|^$/.test(location.hostname)||location.protocol==='file:';
    if(showLock||authed)$('#bLock').classList.remove('hidden');lockUi();
  }
  mReady=true;refreshMusic();
})();
})();
</script>
